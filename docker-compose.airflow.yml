x-airflow-common: &airflow-common
  image: apache/airflow:2.9.3-python3.11
  env_file:
    - airflow.env
  volumes:
    - ./dags:/opt/airflow/dags
    - ./airflow_logs:/opt/airflow/logs
    - ./plugins:/opt/airflow/plugins
    - ./ml:/opt/airflow/ml
    - ./backend:/opt/airflow/backend
  depends_on:
    postgres:
      condition: service_healthy

services:
  # ── Airflow Database Initializer ─────────────────────
  airflow-init:
    <<: *airflow-common
    container_name: railblock-airflow-init
    user: "0:0"
    command:
      - bash
      - -c
      - |
        airflow db migrate &&
        airflow users create \
          --username admin \
          --firstname Indian \
          --lastname Railways \
          --role Admin \
          --email admin@railblock.gov.in \
          --password admin || true
    restart: "no"

  # ── Airflow Webserver UI (Port 8080) ─────────────────
  airflow-webserver:
    <<: *airflow-common
    container_name: railblock-airflow-webserver
    restart: unless-stopped
    command: webserver
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    depends_on:
      airflow-init:
        condition: service_completed_successfully

  # ── Airflow Scheduler (DAG Runner) ───────────────────
  airflow-scheduler:
    <<: *airflow-common
    container_name: railblock-airflow-scheduler
    restart: unless-stopped
    command: scheduler
    depends_on:
      airflow-init:
        condition: service_completed_successfully

  # ── dbt Lineage Docs Server (Port 8085) ──────────────
  dbt-docs:
    image: python:3.11-slim
    container_name: railblock-dbt-docs
    restart: unless-stopped
    working_dir: /app
    volumes:
      - ./dbt:/app/dbt
    command:
      - bash
      - -c
      - "pip install --no-cache-dir dbt-postgres && dbt docs serve --host 0.0.0.0 --port 8085 --no-browser --project-dir dbt --profiles-dir dbt"
    ports:
      - "8086:8085"
    depends_on:
      postgres:
        condition: service_healthy
